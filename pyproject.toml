[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coatipay-sdk"
version = "0.1.0"
description = "CoatiPay Python SDK — the open payment network"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0", "pydantic>=2.7.0", "eth-account>=0.11.0", "eth-keys>=0.4.0", "eth-utils>=2.3.0", "starlette>=0.37.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

# La distribución se llama `coatipay-sdk` pero el módulo importable es
# `coatipay`. Hatchling infiere el directorio del nombre del proyecto
# (buscaría `coatipay_sdk/`), así que hay que declararlo explícito.
[tool.hatch.build.targets.wheel]
packages = ["coatipay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.urls]
Homepage = "https://coatipay.com"
Repository = "https://github.com/lacasoft/coatipay-python-sdk"
